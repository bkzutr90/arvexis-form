<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pendaftaran Tournament Violence District | Arvexis Community</title>
<meta name="theme-color" content="#080406">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"></head><body>
<header class="hero"><div><h1>Violence District<br>Tournament</h1><p>Pendaftaran tim Arvexis Community. Isi 5 pemain utama dan 1 cadangan (opsional).</p></div></header>
<main class="wrap">
<form id="f" novalidate>
  <section class="card"><label>Nama Tim<input id="team" maxlength="40" placeholder="Contoh: Crimson Hounds" autocomplete="off"></label></section>
  <div id="players"></div>
  <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  <p class="msg" id="msg" role="alert"></p>
  <button class="btn" id="go" type="submit">Daftarkan tim</button>
</form>
<section class="card done" id="ok" hidden>
  <h2>Pendaftaran terkirim</h2>
  <p>Tim kamu sudah masuk daftar. Panitia akan menghubungi lewat Discord.</p>
  <button class="btn sm ghost" onclick="location.reload()">Daftarkan tim lain</button>
</section>
</main>
<footer>Arvexis Community</footer>
<script>
const $=s=>document.querySelector(s);
const card=(t,n,cls,req)=>`<section class="card ${cls}" data-i="${n}"><h3>${t}<small>${req?'Wajib':'Opsional'}</small></h3><div class="grid">
<label>Username Discord<input data-k="discord" maxlength="40" autocomplete="off"></label>
<label>Username Roblox<input data-k="roblox" maxlength="40" autocomplete="off"></label>
<label>Role<input data-k="role" maxlength="30" autocomplete="off"></label></div></section>`;
$('#players').innerHTML=[1,2,3,4,5].map(i=>card('Pemain '+i,i-1,'',true)).join('')+card('Cadangan','s','sub',false);
const read=el=>Object.fromEntries([...el.querySelectorAll('input')].map(i=>[i.dataset.k,i.value.trim()]));
$('#f').addEventListener('submit',async e=>{
  e.preventDefault();
  const msg=$('#msg'),btn=$('#go');msg.textContent='';
  document.querySelectorAll('input.bad').forEach(i=>i.classList.remove('bad'));
  const team=$('#team').value.trim();
  const players=[...document.querySelectorAll('.card[data-i]:not(.sub)')].map(read);
  const sub=read(document.querySelector('.sub'));
  const subCount=Object.values(sub).filter(Boolean).length;
  let bad=false;
  if(team.length<2){$('#team').classList.add('bad');bad=true}
  document.querySelectorAll('.card[data-i]').forEach(c=>{
    const isSub=c.classList.contains('sub'),ins=[...c.querySelectorAll('input')];
    const need=!isSub||subCount>0;
    if(need)ins.forEach(i=>{if(!i.value.trim()){i.classList.add('bad');bad=true}});
  });
  if(bad){msg.textContent='Lengkapi kolom yang ditandai merah.';return}
  btn.disabled=true;btn.textContent='Mengirim...';
  try{
    const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({team,players,sub,website:$('#website').value})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||'Gagal mengirim.');
    $('#f').hidden=true;$('#ok').hidden=false;scrollTo({top:0,behavior:'smooth'});
  }catch(err){msg.textContent=err.message;btn.disabled=false;btn.textContent='Daftarkan tim'}
});
</script></body></html>
